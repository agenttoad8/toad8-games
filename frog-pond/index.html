<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root {
    --blue: #1f93ef;
    --blue-deep: #146fba;
    --green: #1f9a45;
    --ink: #145c38;
    --pink: #ff7eb6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", "Gill Sans", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.9) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 30%, rgba(255,255,255,.8) 0 2px, transparent 3px),
      radial-gradient(circle at 40% 80%, rgba(255, 190, 220, .7) 0 2px, transparent 3px),
      linear-gradient(180deg, #c8f3ff 0%, #9fe2fb 42%, #c6efb0 100%);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .app {
    width: min(760px, 100%);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
  }
  header {
    padding: 14px 16px 6px;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 7.4vw, 44px);
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: #128a3d;
    text-shadow: 0 2px 0 #fff, 0 5px 0 rgba(183, 236, 255, .9);
  }
  h1 span { color: var(--pink); }
  #status {
    margin: 6px auto 0;
    min-height: 2.5em;
    max-width: 28em;
    font-size: clamp(15px, 3.8vw, 18px);
    line-height: 1.25;
    color: #17628f;
    font-weight: 700;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 10px 10px;
  }
  .scene {
    position: relative;
    width: min(100%, calc((100dvh - 168px) * 10 / 7));
    aspect-ratio: 10 / 7;
    border-radius: 28px;
    overflow: hidden;
    box-shadow:
      0 10px 0 rgba(20, 111, 186, .18),
      0 18px 40px rgba(20, 90, 140, .25);
    background: #8fd8f8;
  }
  .sky {
    position: absolute;
    inset: 0 0 40% 0;
    background: linear-gradient(180deg, #b7ecff 0%, #e7f8ff 70%, #d7f3c8 100%);
  }
  .sun {
    position: absolute;
    top: 7%;
    right: 8%;
    width: 12%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff8d4, #ffd56a 42%, #ffb15e 74%);
    box-shadow: 0 0 0 8px rgba(255, 214, 140, .35), 0 0 28px rgba(255, 210, 120, .85);
  }
  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 40px;
    height: 7%;
    opacity: .95;
    filter: drop-shadow(0 4px 0 rgba(160, 210, 235, .35));
  }
  .cloud:before, .cloud:after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud.c1 { width: 22%; left: 8%; top: 12%; }
  .cloud.c1:before { width: 46%; height: 160%; left: 12%; bottom: 20%; }
  .cloud.c1:after { width: 38%; height: 130%; right: 14%; bottom: 10%; }
  .cloud.c2 { width: 16%; left: 38%; top: 7%; }
  .cloud.c2:before { width: 50%; height: 150%; left: 18%; bottom: 18%; }
  .hills {
    position: absolute;
    left: -8%;
    right: -8%;
    top: 16%;
    height: 32%;
    background:
      radial-gradient(42% 90% at 16% 100%, #8ee57a 68%, transparent 70%),
      radial-gradient(36% 100% at 48% 130%, #62c85a 68%, transparent 70%),
      radial-gradient(40% 95% at 82% 110%, #b6ee8a 68%, transparent 70%);
    pointer-events: none;
  }
  .bloom {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50% 50% 50% 0;
    background: var(--pink);
    transform: rotate(-40deg);
    box-shadow: 8px 2px 0 #ff9ecb, 4px 8px 0 #ffd0e6;
  }
  .water {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 74%;
    background:
      radial-gradient(120% 80% at 50% 120%, rgba(255,255,255,.18), transparent 46%),
      linear-gradient(180deg, #3cb4ef 0%, #1a90dc 38%, #1477c4 100%);
  }
  .water:after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(closest-side at 20% 40%, rgba(255,255,255,.22), transparent 70%),
      radial-gradient(closest-side at 70% 60%, rgba(255,255,255,.14), transparent 72%);
    animation: shimmer 7s ease-in-out infinite;
  }
  @keyframes shimmer {
    50% { transform: translateX(4%) translateY(2%); opacity: .7; }
  }
  .wave {
    position: absolute;
    left: 0; right: 0;
    top: 22%;
    width: 100%;
    height: 16%;
    z-index: 1;
  }
  .reed {
    position: absolute;
    bottom: 18%;
    width: 4px;
    background: linear-gradient(#1f8a3c, #67c85a);
    border-radius: 4px;
    transform-origin: bottom center;
    z-index: 2;
    pointer-events: none;
  }
  .reed:before {
    content: "";
    position: absolute;
    top: -10px;
    left: -3px;
    width: 10px;
    height: 14px;
    background: #c9843d;
    border-radius: 6px 6px 5px 5px;
  }
  .reed.r1 { left: 6%; height: 16%; transform: rotate(-8deg); }
  .reed.r2 { left: 9%; height: 12%; transform: rotate(6deg); }
  .reed.r3 { right: 7%; height: 15%; transform: rotate(7deg); }
  .reed.r4 { right: 11%; height: 11%; transform: rotate(-5deg); }
  .fish {
    position: absolute;
    z-index: 2;
    width: 16px;
    height: 8px;
    border-radius: 50%;
    background: rgba(8, 70, 120, .28);
    pointer-events: none;
    animation: swim 9s linear infinite;
  }
  .fish:before {
    content: "";
    position: absolute;
    right: -4px;
    top: 1px;
    border: 4px solid transparent;
    border-left-color: rgba(8, 70, 120, .28);
  }
  @keyframes swim {
    0% { transform: translateX(0); }
    50% { transform: translateX(28px) translateY(4px); }
    100% { transform: translateX(0); }
  }
  .pad {
    position: absolute;
    z-index: 3;
    width: 17%;
    aspect-ratio: 1.45 / 1;
    padding: 0;
    border: 0;
    background: transparent;
    transform: translate(-50%, -50%);
    cursor: pointer;
    animation: bob 3.4s ease-in-out infinite;
  }
  .pad svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pad.near .leaf-body {
    filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px var(--pink));
  }
  .pad.near::after {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    top: 22%;
    bottom: 8%;
    border: 2px dashed var(--pink);
    border-radius: 50%;
    pointer-events: none;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { transform: scale(1.06); opacity: .55; }
  }
  .pad:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
    border-radius: 50%;
  }
  .pad.goal { width: 20%; z-index: 3; }
  .sign {
    position: absolute;
    left: 46%;
    bottom: 72%;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    z-index: 4;
    transform: translateX(-50%) rotate(-6deg);
  }
  .board {
    background: var(--blue);
    color: #fff;
    font-weight: 800;
    letter-spacing: .04em;
    font-size: clamp(8px, 2.4vw, 14px);
    line-height: 1;
    padding: 4px 5px 3px;
    border-radius: 8px;
    border: 2px solid var(--pink);
    box-shadow: 0 3px 0 var(--blue-deep);
    white-space: nowrap;
  }
  .post {
    width: 4px;
    height: 16px;
    background: linear-gradient(#e7b56a, #b8732e);
    border-radius: 2px;
  }
  .dock {
    position: absolute;
    z-index: 2;
    right: -2%;
    top: 52%;
    width: 20%;
    height: 18%;
    background:
      repeating-linear-gradient(90deg, #f0c98a 0 11px, #e2ae62 11px 13px, #f6d7a4 13px 22px);
    border-radius: 12px 0 0 12px;
    box-shadow: 0 7px 0 rgba(120, 70, 20, .16);
    pointer-events: none;
  }
  .shadow {
    position: absolute;
    z-index: 3;
    width: 11%;
    height: 4.5%;
    margin: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(8, 50, 90, .28);
    transform: translate(-50%, -20%);
    pointer-events: none;
  }
  .frog {
    position: absolute;
    z-index: 5;
    width: 16%;
    aspect-ratio: 1.05 / 1;
    transform: translate(-50%, -72%);
    pointer-events: none;
    filter: drop-shadow(0 8px 0 rgba(12, 90, 40, .12));
  }
  .frog svg { width: 100%; height: 100%; overflow: visible; }
  .frog.jumping { filter: drop-shadow(0 16px 0 rgba(12, 90, 40, .08)); }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.12); }
  }
  .scene.locked .pad { pointer-events: none; }
  @keyframes bob {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -4px; }
  }
  @keyframes land {
    0% { transform: translate(-50%, -72%) scale(1.16, .78); }
    55% { transform: translate(-50%, -78%) scale(.95, 1.08); }
    100% { transform: translate(-50%, -72%) scale(1); }
  }
  .frog.land { animation: land 240ms ease-out; }
  @keyframes sink {
    to { transform: translate(-50%, -10%) scale(.55, .7); opacity: 0; }
  }
  .frog.sink { animation: sink 380ms ease-in forwards; }
  @keyframes shake {
    20% { transform: translate(calc(-50% - 5px), -72%) rotate(-8deg); }
    40% { transform: translate(calc(-50% + 5px), -72%) rotate(8deg); }
    60% { transform: translate(calc(-50% - 2px), -72%) rotate(-4deg); }
    100% { transform: translate(-50%, -72%); }
  }
  .frog.shake { animation: shake 380ms ease-in-out; }
  .splash {
    position: absolute;
    z-index: 6;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .splash i {
    position: absolute;
    left: 0;
    top: 0;
    border: 3px solid rgba(255,255,255,.9);
    border-radius: 50%;
    width: 8px;
    height: 8px;
    animation: ring 640ms ease-out forwards;
  }
  .splash i:nth-child(2) { animation-delay: 80ms; border-color: #b9ecff; }
  .splash i:nth-child(3) { animation-delay: 150ms; border-color: #ffc1dd; }
  @keyframes ring {
    to { width: 86px; height: 36px; margin: -18px 0 0 -43px; opacity: 0; }
  }
  footer {
    margin-top: auto;
    background: var(--blue);
    color: #fff;
    text-align: center;
    font-weight: 800;
    letter-spacing: .18em;
    font-size: clamp(18px, 4.5vw, 26px);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: inset 0 4px 0 rgba(255,255,255,.25);
  }
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(20, 90, 140, .28);
    backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .card {
    position: relative;
    width: min(420px, 100%);
    background: #fff;
    border-radius: 28px;
    padding: 26px 22px 22px;
    text-align: center;
    box-shadow: 0 12px 0 rgba(20, 111, 186, .18), 0 20px 50px rgba(10, 40, 70, .25);
    border: 4px solid #fff;
    outline: 3px solid var(--pink);
  }
  .card h2 {
    margin: 8px 0 4px;
    font-size: clamp(26px, 6vw, 34px);
    color: #128a3d;
  }
  .card p { margin: 0 0 16px; color: #17628f; font-weight: 700; }
  #again {
    appearance: none;
    border: 0;
    background: var(--pink);
    color: #fff;
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    border-radius: 999px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 5px 0 #e25595;
  }
  #again:active { transform: translateY(2px); box-shadow: 0 3px 0 #e25595; }
  #again:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .confetti {
    position: absolute;
    top: 8px;
    width: 8px;
    height: 12px;
    border-radius: 2px;
    animation: fall 900ms ease-in forwards;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(70px) rotate(180deg); opacity: .2; }
  }
  .noscript {
    margin: 12px;
    text-align: center;
    font-weight: 700;
  }
  @media (prefers-reduced-motion: reduce) {
    .pad, .water:after, .fish, .eyes { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Help the frog home<span>!</span></h1>
      <p id="status">Tap a glowing lily pad. Some of them sink!</p>
    </header>
    <div class="stage">
      <div class="scene" id="scene">
        <div class="sky"></div>
        <div class="sun" aria-hidden="true"></div>
        <div class="cloud c1" aria-hidden="true"></div>
        <div class="cloud c2" aria-hidden="true"></div>
        <div class="hills" aria-hidden="true"></div>
        <div class="water" aria-hidden="true"></div>
        <svg class="wave" viewBox="0 0 1000 180" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#3cb4ef" d="M0 90 C 140 150 240 30 400 86 C 560 146 690 24 860 90 C 940 122 980 100 1000 92 L1000 180 L0 180 Z"/>
          <path fill="#ffffff" opacity=".35" d="M0 100 C 160 150 260 60 420 100 C 580 140 720 70 1000 108 L1000 120 C 720 84 580 156 420 114 C 260 74 160 164 0 114 Z"/>
        </svg>
        <div class="reed r1" aria-hidden="true"></div>
        <div class="reed r2" aria-hidden="true"></div>
        <div class="reed r3" aria-hidden="true"></div>
        <div class="reed r4" aria-hidden="true"></div>
        <div class="fish" style="left:22%; top:62%" aria-hidden="true"></div>
        <div class="fish" style="left:48%; top:78%; animation-delay:-3s" aria-hidden="true"></div>
        <div class="bloom" style="left:18%; top:30%" aria-hidden="true"></div>
        <div class="bloom" style="left:72%; top:28%; transform:rotate(-20deg) scale(.8)" aria-hidden="true"></div>
        <div class="dock" aria-hidden="true"></div>
        <div class="shadow" id="shadow" aria-hidden="true"></div>
        <div class="frog" id="frog" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <ellipse cx="26" cy="86" rx="18" ry="10" fill="#3aaa28" transform="rotate(-28 26 86)"/>
            <ellipse cx="94" cy="86" rx="18" ry="10" fill="#3aaa28" transform="rotate(28 94 86)"/>
            <ellipse cx="16" cy="96" rx="13" ry="6.5" fill="#8be25a"/>
            <ellipse cx="104" cy="96" rx="13" ry="6.5" fill="#8be25a"/>
            <path d="M8 96 h16 M98 96 h16" stroke="#2f8a22" stroke-width="1.4" stroke-linecap="round"/>
            <ellipse cx="60" cy="70" rx="40" ry="32" fill="#63d43c"/>
            <ellipse cx="60" cy="58" rx="22" ry="10" fill="#b6f07a" opacity=".55"/>
            <ellipse cx="60" cy="78" rx="24" ry="18" fill="#e7f8b8"/>
            <ellipse cx="28" cy="74" rx="10" ry="8" fill="#63d43c"/>
            <ellipse cx="92" cy="74" rx="10" ry="8" fill="#63d43c"/>
            <g class="eyes">
              <ellipse cx="40" cy="40" rx="16" ry="16" fill="#63d43c"/>
              <ellipse cx="80" cy="40" rx="16" ry="16" fill="#63d43c"/>
              <circle cx="40" cy="40" r="9" fill="#fff"/>
              <circle cx="80" cy="40" r="9" fill="#fff"/>
              <circle cx="42" cy="41" r="4.6" fill="#1c1c1c"/>
              <circle cx="82" cy="41" r="4.6" fill="#1c1c1c"/>
              <circle cx="43.6" cy="39.2" r="1.7" fill="#fff"/>
              <circle cx="83.6" cy="39.2" r="1.7" fill="#fff"/>
            </g>
            <path d="M50 60 Q60 70 70 60" fill="none" stroke="#1d6b22" stroke-width="2.6" stroke-linecap="round"/>
            <ellipse cx="33" cy="58" rx="6" ry="3.4" fill="#ff8fbf" opacity=".9"/>
            <ellipse cx="87" cy="58" rx="6" ry="3.4" fill="#ff8fbf" opacity=".9"/>
          </svg>
        </div>
      </div>
    </div>
    <footer>TOAD 8</footer>
  </div>
  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div id="confetti"></div>
      <h2 id="win-title">The frog is home!</h2>
      <p>Nice hopping.</p>
      <button type="button" id="again">Play again</button>
    </div>
  </div>
  <noscript><p class="noscript">This pond needs JavaScript so the frog can hop.</p></noscript>
<script>
(function () {
  var PADS = [
    { id: "start", x: 14, y: 70, kind: "start" },
    { id: "p1", x: 33, y: 46, kind: "safe" },
    { id: "t1", x: 32, y: 82, kind: "trap" },
    { id: "p2", x: 51, y: 64, kind: "safe" },
    { id: "t2", x: 52, y: 34, kind: "trap" },
    { id: "p3", x: 69, y: 48, kind: "safe" },
    { id: "t3", x: 70, y: 78, kind: "trap" },
    { id: "goal", x: 83, y: 60, kind: "goal" }
  ];
  var RANGE = 0.30;
  var JUMP_MS = 560;
  var scene = document.getElementById("scene");
  var frog = document.getElementById("frog");
  var shadow = document.getElementById("shadow");
  var status = document.getElementById("status");
  var overlay = document.getElementById("overlay");
  var again = document.getElementById("again");
  var current = PADS[0];
  var busy = false;
  var audioCtx = null;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var LEAF = '<svg viewBox="0 0 140 96" class="leaf" aria-hidden="true">' +
    '<ellipse cx="70" cy="64" rx="58" ry="22" fill="rgba(10,70,40,.18)"/>' +
    '<ellipse class="leaf-body" cx="70" cy="52" rx="58" ry="26" fill="#46d56a"/>' +
    '<ellipse cx="56" cy="44" rx="26" ry="11" fill="#b6f58a" opacity=".7"/>' +
    '<path d="M70 52 L112 36 M70 52 L104 68 M70 52 L36 70 M70 52 L30 40" stroke="#1f8a3c" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>' +
    '<g transform="translate(98,30)">' +
      '<circle cx="0" cy="-7" r="5.5" fill="#ff8cbc"/>' +
      '<circle cx="7" cy="1" r="5.5" fill="#ff6eae"/>' +
      '<circle cx="-6" cy="2" r="5.5" fill="#ffb0d4"/>' +
      '<circle cx="1" cy="6" r="5" fill="#ff7eb6"/>' +
      '<circle cx="0" cy="0" r="3.3" fill="#ffe56a"/>' +
    '</g></svg>';

  PADS.forEach(function (pad, i) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pad" + (pad.kind === "goal" ? " goal" : "");
    btn.dataset.pad = pad.id;
    btn.style.left = pad.x + "%";
    btn.style.top = pad.y + "%";
    btn.style.animationDelay = (-i * 0.45) + "s";
    btn.innerHTML = LEAF;
    if (pad.kind === "goal") {
      btn.insertAdjacentHTML("afterbegin",
        '<span class="sign"><span class="board">TOAD 8</span><span class="post"></span></span>');
    }
    btn.addEventListener("click", function () { hop(pad); });
    scene.appendChild(btn);
    pad.btn = btn;
  });

  function pixelDist(a, b) {
    var w = scene.clientWidth;
    var h = scene.clientHeight;
    var dx = ((a.x - b.x) / 100) * w;
    var dy = ((a.y - b.y) / 100) * h;
    return Math.hypot(dx, dy);
  }

  function pose(pad, lift, rot) {
    frog.style.left = pad.x + "%";
    frog.style.top = pad.y + "%";
    frog.style.transform = "translate(-50%, calc(-72% - " + lift + "px)) rotate(" + rot + "deg)";
    shadow.style.left = pad.x + "%";
    shadow.style.top = pad.y + "%";
    var s = 1 - Math.min(lift, 80) / 140;
    shadow.style.transform = "translate(-50%, -20%) scale(" + (0.45 + s * 0.55) + ", " + (0.7 + s * 0.3) + ")";
    shadow.style.opacity = String(0.35 + s * 0.4);
  }

  function updateNear() {
    var max = scene.clientWidth * RANGE;
    PADS.forEach(function (pad) {
      var reachable = pad.id !== current.id && pixelDist(current, pad) <= max + 0.5;
      pad.btn.classList.toggle("near", reachable && overlay.hidden);
      var name = pad.kind === "goal" ? "Home lily" : "Lily pad";
      pad.btn.setAttribute("aria-label", name);
    });
  }

  function tone(freq, dur, type, gain) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(gain || 0.06, audioCtx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur + 0.02);
    } catch (err) { /* sound is optional */ }
  }

  function splash(pad) {
    var el = document.createElement("div");
    el.className = "splash";
    el.style.left = pad.x + "%";
    el.style.top = pad.y + "%";
    el.innerHTML = "<i></i><i></i><i></i>";
    scene.appendChild(el);
    setTimeout(function () { el.remove(); }, 750);
  }

  function lock(on) {
    busy = on;
    scene.classList.toggle("locked", on);
  }

  function settle(pad) {
    frog.classList.remove("sink", "shake", "jumping");
    frog.style.opacity = "1";
    current = pad;
    pose(pad, 0, 0);
    frog.classList.add("land");
    setTimeout(function () { frog.classList.remove("land"); }, 260);
    updateNear();
    lock(false);
  }

  function sendHome(message) {
    status.textContent = message;
    setTimeout(function () {
      frog.classList.remove("sink", "shake");
      frog.style.opacity = "1";
      current = PADS[0];
      pose(current, 0, 0);
      frog.classList.add("land");
      updateNear();
      lock(false);
    }, reduced ? 180 : 460);
  }

  function animateJump(from, to, done) {
    var dur = reduced ? 140 : JUMP_MS;
    var t0 = performance.now();
    var face = to.x >= from.x ? 1 : -1;
    frog.classList.add("jumping");
    function frame(now) {
      var t = Math.min(1, (now - t0) / dur);
      var e = t * t * (3 - 2 * t);
      var x = from.x + (to.x - from.x) * e;
      var y = from.y + (to.y - from.y) * e;
      var lift = reduced ? 0 : Math.sin(Math.PI * t) * 72;
      var rot = reduced ? 0 : Math.sin(Math.PI * t) * 14 * face;
      pose({ x: x, y: y }, lift, rot);
      if (t < 1) requestAnimationFrame(frame);
      else {
        frog.classList.remove("jumping");
        pose(to, 0, 0);
        done();
      }
    }
    requestAnimationFrame(frame);
  }

  function celebrate() {
    status.textContent = "Home!";
    var box = document.getElementById("confetti");
    box.innerHTML = "";
    var colors = ["#ff7eb6", "#7cdb4a", "#3db7ff", "#ffe56a", "#fff"];
    for (var i = 0; i < 18; i++) {
      var bit = document.createElement("i");
      bit.className = "confetti";
      bit.style.left = (8 + Math.random() * 84) + "%";
      bit.style.background = colors[i % colors.length];
      bit.style.animationDelay = (Math.random() * 180) + "ms";
      box.appendChild(bit);
    }
    overlay.hidden = false;
    again.focus();
    tone(523, 0.12, "triangle", 0.05);
    setTimeout(function () { tone(659, 0.12, "triangle", 0.05); }, 120);
    setTimeout(function () { tone(784, 0.22, "triangle", 0.05); }, 240);
    updateNear();
    lock(false);
  }

  function hop(pad) {
    if (busy || !overlay.hidden || pad.id === current.id) return;
    var max = scene.clientWidth * RANGE;
    var from = current;
    if (pixelDist(from, pad) > max + 0.5) {
      lock(true);
      splash(pad);
      tone(180, 0.18, "sine", 0.05);
      frog.classList.add("shake");
      sendHome("Too far to jump. Back to the start.");
      return;
    }
    lock(true);
    tone(520, 0.1, "triangle", 0.05);
    animateJump(from, pad, function () {
      if (pad.kind === "trap") {
        splash(pad);
        tone(140, 0.22, "sine", 0.06);
        frog.classList.add("sink");
        sendHome("Splash! That pad sinks. Try from the start.");
        return;
      }
      if (pad.kind === "goal") {
        current = pad;
        pose(pad, 0, 0);
        frog.classList.add("land");
        celebrate();
        return;
      }
      settle(pad);
      status.textContent = "Nice hop. Try another glowing pad.";
      tone(640, 0.08, "sine", 0.04);
    });
  }

  function resetGame() {
    overlay.hidden = true;
    status.textContent = "Tap a glowing lily pad. Some of them sink!";
    frog.classList.remove("sink", "shake", "land", "jumping");
    frog.style.opacity = "1";
    current = PADS[0];
    pose(current, 0, 0);
    updateNear();
    lock(false);
  }

  again.addEventListener("click", resetGame);
  window.addEventListener("resize", updateNear);
  pose(current, 0, 0);
  updateNear();

})();
</script>
</body>
</html>
