# Publishes the static site in this repository to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site/frog-pond _site/find-the-frogs _site/spot-the-difference _site/word-scramble _site/memory-match
          cp index.html og.png .nojekyll _site/
          cp frog-pond/index.html _site/frog-pond/index.html
          cp find-the-frogs/index.html find-the-frogs/board.png _site/find-the-frogs/
          cp spot-the-difference/index.html spot-the-difference/picnic.png _site/spot-the-difference/
          cp word-scramble/index.html _site/word-scramble/index.html
          cp memory-match/index.html _site/memory-match/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
